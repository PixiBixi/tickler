name: CodeQL

# Swift analysis traces a full build (about 14 min): only pushes to main that touch code, plus a weekly run.
# Not on pull requests: nothing waits for it before merging, and it held a macOS runner while CI and App queued.
# A traced build cannot come from a cache, CodeQL would see nothing compiled.
# Dependency bumps (Package.*) do not change our code: dependency review covers them.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "App/**"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly: a query published after the last push still gets to run.
    - cron: "27 4 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Xcode as the local builds: a different Swift version accepts or rejects different code.
  XCODE_VERSION: "26.4.1"

jobs:
  analyze:
    name: Analyze
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: swift build

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
