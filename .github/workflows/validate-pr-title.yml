name: Validate PR title

on:
  # pull_request, not pull_request_target: the action reads the title from the
  # event payload and needs neither a privileged token nor the PR's code.
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: validate-pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Conventional Commits
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # A squash merge takes the PR title as its commit message, so a title
      # outside the convention breaks the history.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
