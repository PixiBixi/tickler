name: Validate PR title

on:
  # pull_request, not pull_request_target: the action reads the title from the
  # event payload and needs neither a privileged token nor the PR's code.
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: validate-pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Conventional Commits
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # A squash merge takes the PR title as its commit message, so a title
      # outside the convention breaks the history.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
