name: App

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "project.yml"
      - "Sources/TicklerCore/**"
      - "Package.*"
      - ".github/workflows/app.yml"
  pull_request:
    branches: [main]
    paths:
      - "App/**"
      - "project.yml"
      - "Sources/TicklerCore/**"
      - "Package.*"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"
  # renovate: datasource=github-releases depName=yonaskolb/XcodeGen
  XCODEGEN_VERSION: 2.46.0

jobs:
  build:
    name: Build app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          rm xcodegen.zip

      - name: Build the app
        run: make app CONFIGURATION=Debug
