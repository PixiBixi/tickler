# Run with prek (or pre-commit): `prek install` sets up all three hook types below.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # SwiftFormat and SwiftLint come from Homebrew: their upstream hooks build from source.
  - repo: local
    hooks:
      - id: swiftformat
        name: swiftformat
        entry: swiftformat --lint
        language: system
        files: '\.swift$'
        # Generated by scripts/embed-skill.sh: a commit touching only it has nothing to lint.
        exclude: '^Sources/TicklerCore/Skill/SkillContent\.swift$'

      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --strict --quiet
        language: system
        files: '\.swift$'
        exclude: '^Sources/TicklerCore/Skill/SkillContent\.swift$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        # CHANGELOG.md is generated by cocogitto, .claude/skills/graft is vendored by graft.
        exclude: '^(docs/superpowers/|CHANGELOG\.md$|\.claude/skills/graft/)'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional-commit
        entry: scripts/check-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: swift-test
        name: swift test
        entry: swift test
        language: system
        pass_filenames: false
        files: '^(Sources|Tests)/.*\.swift$'
        stages: [pre-push]

      - id: app-build
        name: make app
        entry: make app CONFIGURATION=Debug
        language: system
        pass_filenames: false
        # make test never compiles App/: a core change can still break it.
        files: '^(App/|Sources/TicklerCore/.*\.swift$|project\.yml$)'
        stages: [pre-push]
