included:
  - Sources
  - Tests
  - App/Sources
excluded:
  - .build
  - build
disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
  # Lossy UTF-8 decoding of process output is intended: a bad byte must not drop the whole message.
  - optional_data_string_conversion
opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - redundant_nil_coalescing
line_length:
  warning: 140
  error: 160
identifier_name:
  excluded: [id, db, at, to, ok, fr, en, r, i, n, s, mr, pr, gh]
type_body_length:
  warning: 400
file_length:
  warning: 600
function_body_length:
  warning: 60
# Decoding DTOs live inside the function that decodes them.
nesting:
  type_level: 4
type_name:
  excluded: [MR, PR]
cyclomatic_complexity:
  warning: 15
