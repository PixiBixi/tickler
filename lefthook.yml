pre-commit:
  parallel: true
  jobs:
    - name: swiftformat
      glob: "*.swift"
      run: swiftformat --lint {staged_files}

    - name: swiftlint
      glob: "*.swift"
      run: swiftlint lint --strict --quiet --force-exclude {staged_files}

    - name: gitleaks
      run: gitleaks protect --staged --redact

    - name: markdownlint
      glob: "*.md"
      exclude:
        - "docs/superpowers/**"
        # Generated by cocogitto from the commit messages.
        - "CHANGELOG.md"
      run: markdownlint-cli2 {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}
