pre-commit:
  parallel: true
  jobs:
    - name: swiftformat
      glob: "*.swift"
      # Generated by scripts/embed-skill.sh: a commit touching only it has nothing to lint.
      exclude:
        - "Sources/TicklerCore/Skill/SkillContent.swift"
      run: swiftformat --lint {staged_files}

    - name: swiftlint
      glob: "*.swift"
      # Generated by scripts/embed-skill.sh: a commit touching only it has nothing to lint.
      exclude:
        - "Sources/TicklerCore/Skill/SkillContent.swift"
      run: swiftlint lint --strict --quiet {staged_files}

    - name: gitleaks
      run: gitleaks protect --staged --redact

    - name: markdownlint
      glob: "*.md"
      exclude:
        - "docs/superpowers/**"
        # Generated by cocogitto from the commit messages.
        - "CHANGELOG.md"
        # Vendored by graft, overwritten on each graft upgrade.
        - ".claude/skills/graft/**"
      run: markdownlint-cli2 {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

pre-push:
  jobs:
    - name: swift-test
      glob: "{Sources,Tests}/**/*.swift"
      run: swift test

    - name: app-build
      # make test never compiles App/: a core change can still break it.
      glob: "{App/**/*,Sources/TicklerCore/**/*.swift,project.yml}"
      run: make app CONFIGURATION=Debug

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}
